version: "3.9"

services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./news.db:/app/news.db        # persist SQLite DB
      - ./logs:/app/logs              # persist logs
    restart: unless-stopped

  # ── Pipeline runner (all stages on schedule) ───────────────
  pipeline:
    build: .
    command: python manage.py run-all
    env_file:
      - .env
    volumes:
      - ./news.db:/app/news.db
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - dashboard

