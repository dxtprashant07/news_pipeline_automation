name: CD — Deploy to Server

on:
  push:
    branches: ["main"]

# Only run deploy after CI passes
jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []   # add "test" from ci.yml once CI is green consistently

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     22
          script: |
            cd ~/news_pipeline_automation

            # Pull latest code
            git pull origin main

            # Rebuild and restart containers (zero-downtime for dashboard)
            docker-compose pull
            docker-compose up -d --build

            # Run DB migrations
            docker-compose exec -T pipeline python manage.py db-init

            # Remove unused Docker images to save disk space
            docker image prune -f

            echo "Deployment complete — $(date)"
